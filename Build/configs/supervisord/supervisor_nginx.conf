[supervisord]
nodaemon=true
[program:webapp]
command=/usr/bin/dotnet /app-files/apps/web/Manifest.Api.All.dll
autostart=true
autorestart=true
stdout_logfile= /dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=ASPNETCORE_ENVIRONMENT=Production 
stopsignal=INT

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=900
stdout_logfile= /dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
