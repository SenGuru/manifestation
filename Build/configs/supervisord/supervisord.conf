[supervisord]
nodaemon=true
user=root

[program:webapp]
command=/usr/bin/dotnet /app-files/apps/web/Manifest.Api.All.dll --API_PORT 80 --SSL_API_PORT 443
autostart=true
autorestart=true
stderr_logfile=/var/log/my-dotnet-app.err.log
stdout_logfile=/var/log/my-dotnet-app.out.log
stdout_logfile_maxbytes=50000
stderr_logfile_maxbytes=50000
environment=ASPNETCORE_ENVIRONMENT=Production 
stopsignal=INT