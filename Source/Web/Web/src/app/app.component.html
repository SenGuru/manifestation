<block-ui [delayStart]='10'>
  <router-outlet></router-outlet>
</block-ui>

<!--start back-to-top-->
<button type="button" class="btn btn-danger btn-icon landing-back-top" id="back-to-top" (click)="topFunction()">
    <i class="ri-arrow-up-line"></i>
  </button>
  <!--end back-to-top-->

    
  <ng-template #childModal>
    <div class="modal-header p-3">
      <h5 class="modal-title" id="manifest-idle-modal-title">You Have Been Idle!</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cancel"
        id="manifest-idle-modal-cancel-btn" (click)="hideChildModal()"></button>
    </div>

    <div class="modal-body">
      {{idleState}}
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-danger btn-sm ml-auto" id="avtall-user-form-idle-logout-btn" (click)="logout()">Logout</button>
      <button type="button" class="btn btn-success btn-sm" id="avtall-user-form-idle-stay-btn" (click)="stay()">Stay</button>
    </div>
  </ng-template>
