<form #lvJobTemplateCategoryForm="ngForm" name="form" appFocusOnError
  (ngSubmit)="lvJobTemplateCategoryForm.form.valid && onSubmit(lvJobTemplateCategoryForm)">
  <div class="modal-header p-3">
    <h5 class="modal-title" id="manifest-job-template-category-modal-title">{{title}}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cancel"
      id="manifest-job-template-category-modal-cancel-btn" (click)="cancel(true)"></button>
  </div>
  <div class="modal-body">

    <div class="form-group row mb-4">

      <div class="col-sm-6">
        <label class="form-label" for="name">Name
          <span *ngIf="!isViewMode" class="required-sign">&nbsp;*</span>
        </label>
        <div *ngIf="!isViewMode">
          <input #lvName="ngModel" type="text" name="name" id="name" required ngbAutoFocus class="form-control"
            placeholder="Name" [ngClass]="{'is-invalid': lvJobTemplateCategoryForm.submitted && lvName.invalid }"
            [(ngModel)]="jobTemplateCategoryModel.name">
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="(lvJobTemplateCategoryForm.submitted) && lvName.errors?.['required']">
              Name is required
            </span>
          </div>
        </div>
        <div *ngIf="isViewMode">
          {{jobTemplateCategoryModel.name ? jobTemplateCategoryModel.name : '-'}}
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light btn-sm mnf-btn-sm" id="manifest-job-template-category-modal-close-btn"
      data-bs-dismiss="modal" (click)="cancel(true)">Close</button>
    <button *ngIf="!isViewMode" type="submit" class="btn btn-sm mnf-btn-sm btn-success"
      id="manifest-job-template-category-modal-submit-btn">{{buttonText}}</button>
  </div>
</form>
