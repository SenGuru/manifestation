<div class="row">
  <div class="col-lg-12">
      <div class="card mt-n4 mx-n4">
          <div class="bg-warning-subtle">
              <div class="card-body pb-0 px-4">
                  <div class="row mb-3">
                      <div class="col-md">
                          <div class="row align-items-center g-3">
                              <div class="col-md-auto">
                                  <div class="col-auto">
                                      <div class="avatar-md">
                                          <img  alt="" class="img-thumbnail rounded-circle" [src]="'assets/images/camera.png'" />
                                      </div>
                                  </div>
                              </div>
                              <div class="col-md">
                                  <div>
                                      <h4 class="fw-bold">Search Result</h4>
                                      <div class="hstack gap-3 flex-wrap">
                                          <div> <i class="ri-dashboard-fill"></i> Movies : 3
                                          </div>
                                          <div class="vr"></div>
                                          <div><i class="ri-menu-2-line"></i> Shoot Days : 333
                                          </div>
                                          <div class="vr"></div>
                                          <div><i class="ri-currency-line"></i> Company: 44</div>
                                          <div class="vr"></div>
                                          <div><i class="ri-team-line"></i> Users: 23</div>
                                          <div class="vr"></div>
                                          <div class="badge rounded-pill bg-info fs-12">New</div>
                                      </div>
                                  </div>
                              </div>
                          </div>
                      </div>
                      <div class="col-md-auto">
                          <div class="hstack gap-1 flex-wrap">
                              <button type="button" class="btn py-0 fs-16 text-body material-shadow-none"
                                  (click)="backToHomeScreen();">
                                  <i class="ri-arrow-go-back-fill"></i>
                              </button>
                          </div>
                      </div>
                  </div>

              </div>
              <!-- end card body -->
          </div>
      </div>
      <!-- end card -->
  </div>
  <!-- end col -->
</div>
