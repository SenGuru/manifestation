<app-super-admin-header></app-super-admin-header>

<div class="page-header px-3 py-2">
  <div class="d-flex align-items-center">
    <div class="col-sm-auto">
      <!-- Page title -->
      <h3 class="card-title mb-0 flex-grow-1" id="manifest-voice-notification-server-page-title">
        Voice Notification Servers
      </h3>
    </div>
    <!-- add voiceNotificationServer btn -->
    <div class="d-flex justify-content-sm-end col-sm">
      <button type="button" class="btn btn-sm mnf-btn-sm btn-success" data-bs-toggle="modal"
        id="create-voice-notification-server-btn" (click)="showAddVoiceNotificationServerModal();"><i
          class="ri-add-line align-bottom me-1"></i> Add Voice Notification Server</button>
    </div>
  </div>
</div>
<div class="card mb-2">
  <div class="card-header pt-1">
    <form #voiceNotificationServerSearch="ngForm" novalidate focusOnError
      (ngSubmit)="onSearch(voiceNotificationServerSearch)">

      <div class="row">
        <div class="col-md-2 pr-0">
          <input type="text" class="form-control" name="voice-notification-server-search-input"
            placeholder="Search Text" [(ngModel)]="this.searchModel.keyword" />
        </div>
        
        <div class="col-md-2 pr-0">
          <ng-select name="selectedPredefinedSmsAndVoiceServerTypes" bindLabel="type" placeholder="Server Type"
            [items]="predefinedSmsAndVoiceServerTypes" [multiple]="true" [clearable]="true"
            [(ngModel)]="selectedPredefinedSmsAndVoiceServerTypes">
            <ng-template let-item="item" let-index="index" let-search="searchTerm" ng-option-tmp>
              <div style="margin: 4px;" title="{{item.type}}">
                <div> {{item.type}}</div>
              </div>
            </ng-template>
            <ng-template let-items="items" let-clear="clear" ng-multi-label-tmp>
              <div *ngFor="let item of selectedPredefinedSmsAndVoiceServerTypes | slice:-1:1" class="ng-value">
                <span class="ng-value-label truncate cursor-pointer" title="{{item.type}}">{{item.type}}</span>
                <span class="ng-value-icon right" aria-hidden="true" (click)="clear(item)">×</span>
              </div>
              <div *ngIf="items.length > 1" class="ng-value">
                <span class="ng-value-label">{{items.length - 0}} Selected...</span>
              </div>
            </ng-template>
          </ng-select>
        </div>
        <div class="d-flex justify-content-sm-end col-sm">
          <button type="submit" class="btn btn-sm mnf-btn-sm btn-primary search" data-bs-toggle="modal"
            id="voice-notification-server-search-btn"><i class="ri-search-line align-bottom me-1"></i> Search</button>
          <button type="button" class="btn btn-sm mnf-btn-sm bg-light" (click)="onReset(voiceNotificationServerSearch)">
            Reset
          </button>
        </div>
      </div>
    </form>
  </div>

  <div class="card-body">
    <div class="table-responsive table-card manifest-table" id="manifest-voice-notification-server-page-table">
      <table *ngIf="listData.length > 0; else nodata" class="table">
        <thead class="manifest-table-header">
          <tr>
            <th *ngFor="let column of columns" class="text-left" [ngClass]="{
          'w-1': column.value === 'action',
          'sort': column.sortable
        }" (click)="changeSort(column)">
              <span class="mr-1" [innerHTML]="column.text"></span>
              <i [ngClass]="
            searchModel.sortBy === column.value
              ? 'fa fa-sort-' + currentSort
              : ''
          "></i>
            </th>
            <th class="text-left w-1 last-col-floating-container">
              <span class="mr-1">ACTION</span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of listData">
            <td class="text-left">
              {{ item.voiceNotificationServerName }}
            </td>
            <td>
              <span
                class="badge bg-{{enumViewService.getPredefinedSmsAndVoiceServerTypeClass(item.predefinedSmsAndVoiceServerTypeId)}}-subtle text-{{enumViewService.getPredefinedSmsAndVoiceServerTypeClass(item.predefinedSmsAndVoiceServerTypeId)}}">
                <!-- {{ item.predefinedSmsAndVoiceServerTypeName  }} -->
              </span>
            </td>
            <td class="text-left">
              {{ item.isEnabled }}
            </td>
            <td class="text-left">
              {{ item.modifiedDate | date: 'dd/MM/yy' }}
            </td>
            <td class="text-left">
              {{ item.modifiedByUserFirstName }} {{ item.modifiedByUserLastName }}
            </td>
            <td class="text-left last-col-floating-container">
              <div class="d-flex gap-2">
                <div class="view">
                  <button type="button" class="btn btn-sm mnf-btn-sm btn-success edit-item-btn" data-bs-toggle="modal"
                    (click)="showViewVoiceNotificationServerModal(item)">View</button>
                </div>
                <div class="edit">
                  <button type="button" class="btn btn-sm mnf-btn-sm btn-success edit-item-btn" data-bs-toggle="modal"
                    (click)="showUpdateVoiceNotificationServerModal(item)">Edit</button>
                </div>
                <div class="remove">
                  <button type="button" class="btn btn-sm mnf-btn-sm btn-danger remove-item-btn" data-bs-toggle="modal"
                    (click)="deleteVoiceNotificationServer(item)">Remove</button>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <ng-template #nodata>
        <app-no-data-found></app-no-data-found>
      </ng-template>
    </div>
    <app-pagination #pagination [totalItems]="totalItems" [currentPage]="searchModel.page"
      (pageOptionChanged)="paginationChange($event)"></app-pagination>
  </div>
</div>
