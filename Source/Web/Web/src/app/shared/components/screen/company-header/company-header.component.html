<div class="row">
    <div class="col-lg-12">
        <div class="card mt-n4 mx-n4">
            <div class="bg-warning-subtle">
                <div class="card-body pb-0 px-4">
                    <div class="row mb-3">
                        <div class="col-md">
                            <div class="row align-items-center g-3">
                                <div class="col-md-auto">
                                    <div class="col-auto">
                                        <div class="avatar-md">
                                            <img alt=""
                                                class="img-thumbnail rounded-circle auditduo-header-img"
                                                [src]="companyProfilePicture ? companyProfilePicture : 'assets/images/office.png'" />
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md">
                                    <div>
                                        <h4 class="fw-bold">{{companyInfo ? companyInfo.companyName : '-'}}</h4>
                                        <div class="hstack gap-3 flex-wrap">
                                            <div> <i class="mdi mdi-email"></i> Email:
                                                {{companyInfo?.email}}</div>
                                            <div> <i class="mdi mdi-phone"></i> Phone:
                                                {{companyInfo?.cellPhone}}</div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-auto">
                            <div class="hstack gap-1 flex-wrap">
                                <button *ngIf="isSuperAdmin " type="button"
                                    class="btn py-0 fs-16 text-body material-shadow-none"
                                    (click)="backToCompanyListScreen();">
                                    <i class="ri-arrow-go-back-fill"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <!-- tabs start -->
                    <div *ngIf="companyConfig || appointmentConfig" class="col-xxl-12">
                        <div class="card mb-0 shadow-none bg-transparent">
                            <div class="card-header align-items-center d-flex bg-transparent">
                                <div class="flex-shrink-0 ms-2">
                                    <ul ngbNav
                                        class="nav justify-content-end nav-tabs-custom rounded card-header-tabs border-bottom-0">

                                        <li *ngIf="companyConfig" class="nav-item cursor-pointer"
                                            (click)="changeTab('info')">
                                            <a class="nav-link bg-transparent pt-0 pb-2"
                                                [ngClass]="selectedCompanyConfigScreenType === 'info' ? 'active' : ''">
                                                Information
                                            </a>
                                        </li>

                                        <!-- <li *ngIf="companyConfig && isSuperAdmin" class="nav-item cursor-pointer"
                                            (click)="changeTab('storage-config')">
                                            <a class="nav-link bg-transparent pt-0 pb-2"
                                                [ngClass]="selectedCompanyConfigScreenType === 'storage-config' ? 'active' : ''">
                                                Storage Config
                                            </a>
                                        </li> -->

                                        <!-- <li *ngIf="companyConfig" class="nav-item cursor-pointer"
                                            (click)="changeTab('company-licenses')">
                                            <a class="nav-link bg-transparent pt-0 pb-2"
                                                [ngClass]="selectedCompanyConfigScreenType === 'company-licenses' ? 'active' : ''">
                                                Licenses
                                            </a>
                                        </li> -->

                                        <li *ngIf="appointmentConfig" class="nav-item cursor-pointer"
                                            (click)="changeTab('appointment-list')">
                                            <a class="nav-link bg-transparent pt-0 pb-2"
                                                [ngClass]="selectedCompanyConfigScreenType === 'appointment-list' ? 'active' : ''">
                                                 Appointment
                                            </a>
                                        </li>

                                        <li *ngIf="appointmentConfig" class="nav-item cursor-pointer"
                                            (click)="changeTab('appointment-calendar')">
                                            <a class="nav-link bg-transparent pt-0 pb-2"
                                                [ngClass]="selectedCompanyConfigScreenType === 'appointment-calendar' ? 'active' : ''">
                                                 Calendar
                                            </a>
                                        </li>

                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- tabs end -->

                </div>
                <!-- end card body -->
            </div>
        </div>
        <!-- end card -->
    </div>
    <!-- end col -->
</div>
