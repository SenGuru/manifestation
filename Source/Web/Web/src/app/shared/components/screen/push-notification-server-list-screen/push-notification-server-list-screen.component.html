<app-super-admin-header></app-super-admin-header>
<div class="page-header px-3 py-2">
  <div class="d-flex align-items-center">
    <div class="col-sm-auto">
      <!-- Page title -->
      <h3 class="card-title mb-0 flex-grow-1" id="auditduo-push-notification-server-page-title">
        Push Notification Servers
      </h3>
    </div>
    <!-- add pushNotificationServer btn -->
    <div class="d-flex justify-content-sm-end col-sm">
      <button type="button" class="btn btn-sm aduo-btn-sm btn-success" data-bs-toggle="modal"
        id="create-push-notification-server-btn" (click)="showAddPushNotificationServerModal();"><i
          class="ri-add-line align-bottom me-1"></i> Add Push Notification Server</button>
    </div>
  </div>
</div>
<div class="card mb-2">
  <div class="card-header pt-1">
    <form #pushNotificationServerSearch="ngForm" novalidate focusOnError
      (ngSubmit)="onSearch(pushNotificationServerSearch)">

      <div class="row">
        <div class="col-md-2 pr-0">
          <input type="text" class="form-control" name="push-notification-server-search-input" placeholder="Search Text"
            [(ngModel)]="this.searchModel.keyword" />
        </div>
        <div class="d-flex justify-content-sm-end col-sm">
          <button type="submit" class="btn btn-sm aduo-btn-sm btn-primary search" data-bs-toggle="modal"
            id="push-notification-server-search-btn"><i class="ri-search-line align-bottom me-1"></i> Search</button>
          <button type="button" class="btn btn-sm aduo-btn-sm bg-light" (click)="onReset(pushNotificationServerSearch)">
            Reset
          </button>
        </div>
      </div>
    </form>
  </div>

  <div class="card-body">
    <div class="table-responsive table-card auditduo-table" id="auditduo-push-notification-server-page-table">
      <table *ngIf="listData.length > 0; else nodata" class="table">
        <thead class="auditduo-table-header">
          <tr>
            <th *ngFor="let column of columns" class="text-left" [ngClass]="{
          'w-1': column.value === 'action',
          'sort': column.sortable
        }" (click)="changeSort(column)">
              <span class="mr-1" [innerHTML]="column.text"></span>
              <i [ngClass]="
            searchModel.sortBy === column.value
              ? 'fa fa-sort-' + currentSort
              : ''
          "></i>
            </th>
            <th class="text-left w-1 last-col-floating-container">
              <span class="mr-1">ACTION</span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of listData">
            <td class="text-left">
              {{ item.pushNotificationServerName }}
            </td>
            <td>
              <span
                class="badge bg-{{enumViewService.getPredefinedPushNotificationServerTypeClass(item.predefinedPushNotificationServerTypeId)}}-subtle text-{{enumViewService.getPredefinedPushNotificationServerTypeClass(item.predefinedPushNotificationServerTypeId)}}">
                <!-- {{ item.predefinedPushNotificationServerTypeName  }} -->
              </span>
            </td>
            <td class="text-left">
              <!-- {{ item.projectName  }} -->
            </td>
            <td class="text-left">
              {{ item.isEnabled }}
            </td>
            <td class="text-left">
              {{ item.modifiedDate | date: 'dd/MM/yy' }}
            </td>
            <td class="text-left">
              {{ item.modifiedByUserFirstName }} {{ item.modifiedByUserLastName }}
            </td>
            <td class="text-left last-col-floating-container">
              <div class="d-flex gap-2">
                <div class="view">
                  <button type="button" class="btn btn-sm aduo-btn-sm btn-success edit-item-btn" data-bs-toggle="modal"
                    (click)="showViewPushNotificationServerModal(item)">View</button>
                </div>
                <div class="edit">
                  <button type="button" class="btn btn-sm aduo-btn-sm btn-success edit-item-btn" data-bs-toggle="modal"
                    (click)="showUpdatePushNotificationServerModal(item)">Edit</button>
                </div>
                <div class="remove">
                  <button type="button" class="btn btn-sm aduo-btn-sm btn-danger remove-item-btn" data-bs-toggle="modal"
                    (click)="deletePushNotificationServer(item)">Remove</button>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <ng-template #nodata>
        <app-no-data-found></app-no-data-found>
      </ng-template>
    </div>
    <app-pagination #pagination [totalItems]="totalItems" [currentPage]="searchModel.page"
      (pageOptionChanged)="paginationChange($event)"></app-pagination>
  </div>
</div>
