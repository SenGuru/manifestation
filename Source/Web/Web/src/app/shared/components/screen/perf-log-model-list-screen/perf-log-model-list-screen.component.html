<app-super-admin-header></app-super-admin-header>

<div class="page-header px-3 py-2">
  <div class="d-flex align-items-center">
    <div class="col-sm-auto">
      <!-- Page title -->
      <h3 class="card-title mb-0 flex-grow-1 mt-2" id="manifest-page-title-perf-log-viewer">
        Perf Log Viewer
      </h3>
    </div>
  </div>
</div>

<div class="card mb-0" id="perf-log-list-card">
  <div class="card-header">
    <form #perfLogModelSearch="ngForm" novalidate focusOnError id="perf-log-list-form"
      (ngSubmit)="onSearch(perfLogModelSearch)">

      <div class="row">
        <div class="col-sm-2 pr-2">
          <input type="text" class="form-control" name="example-text-input" id="perf-log-list-form-search"
            placeholder="Search Text" [(ngModel)]="searchModel.keyword" />
        </div>

        <div class="col-sm-1 pr-2">
          <ng-select name="selectedAppPerfLogTimeType" id="selectedAppPerfLogTimeType" bindLabel="type"
            placeholder="Operation" [items]="appPerfLogTimeTypes" [clearable]="true"
            [(ngModel)]="selectedAppPerfLogTimeType" (change)="changePerfLogTimeType()">
          </ng-select>
        </div>

        <div *ngIf="selectedAppPerfLogTimeType?.id === perfLogTimeType.LessThanMS" class="col-sm-1 pr-2">
          <input #lvLessThanMS="ngModel" type="number" id="lesserThanMS" class="form-control" name="lesserThanMS"
            placeholder="Lesser Than MS" min="0"
            [ngClass]="{'is-invalid': perfLogModelSearch.submitted && lvLessThanMS.invalid }"
            [(ngModel)]="searchModel.lesserThanMS" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="(perfLogModelSearch.submitted) && lvLessThanMS.errors?.['min']">
              Lesser Than MS is not a valid
            </span>
          </div>
        </div>

        <div *ngIf="selectedAppPerfLogTimeType?.id === perfLogTimeType.EqualMS" class="col-sm-1 pr-2">
          <input #lvEqualToMs="ngModel" type="number" id="equalToMs" class="form-control" name="equalToMs"
            placeholder="Equal To Ms" min="0"
            [ngClass]="{'is-invalid': perfLogModelSearch.submitted && lvEqualToMs.invalid }"
            [(ngModel)]="searchModel.equalToMs" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="(perfLogModelSearch.submitted) && lvEqualToMs.errors?.['min']">
              Equal To Ms is not a valid
            </span>
          </div>
        </div>

        <div *ngIf="selectedAppPerfLogTimeType?.id === perfLogTimeType.GreaterThanMS" class="col-sm-1 pr-2">
          <input #lvGreaterThanMS="ngModel" type="number" id="greaterThanMS" class="form-control" name="greaterThanMS"
            min="0" placeholder="Greater Than MS"
            [ngClass]="{'is-invalid': perfLogModelSearch.submitted && lvGreaterThanMS.invalid }"
            [(ngModel)]="searchModel.greaterThanMS" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="(perfLogModelSearch.submitted) && lvGreaterThanMS.errors?.['min']">
              Greater Than MS is not a valid
            </span>
          </div>
        </div>

        <div class="col-cd-1-12 pr-2">
          <input type="text" id="appModule" class="form-control" name="appModule" placeholder="App Module"
            [(ngModel)]="searchModel.appModule" />
        </div>
        <div class="col-cd-1-12 pr-2">
          <input type="text" id="appName" class="form-control" name="appName" placeholder="App Name"
            [(ngModel)]="searchModel.appName" />
        </div>
        <div class="col-cd-1-12 pr-2">
          <input type="text" id="functionName" class="form-control" name="functionName" placeholder="Function"
            [(ngModel)]="appFunctionName" />
        </div>

        <div class="col-cd-10 pr-2">
          <input #txtStartDate class="form-control flatpickr-input" type="text" mwlFlatpickr name="pefLogStartDate"
            id="pefLogStartDate" altFormat="F j, Y" dateFormat="Y-m-d" placeholder="Start Date" [altInput]="true"
            [convertModelValue]="true" [(ngModel)]="startDate" />
        </div>

        <div class="col-cd-10 pr-2">
          <input #txtEndDate class="form-control flatpickr-input" type="text" mwlFlatpickr name="pefLogEndDate"
            id="pefLogEndDate" altFormat="F j, Y" dateFormat="Y-m-d" placeholder="End Date" [altInput]="true"
            [convertModelValue]="true" [(ngModel)]="endDate" />
        </div>

        <div class="col-auto ml-auto mt-auto">
          <button type="button" class="btn btn-primary mnf-btn-sm mx-2" id="perf-log-list-form-search-btn">
            <app-icon-search></app-icon-search>
            Search
          </button>
          <button type="button" class="btn btn-secondary mnf-btn-sm ml-1" id="perf-log-list-form-reset-btn"
            (click)="onReset(perfLogModelSearch)">
            Reset
          </button>
        </div>
      </div>
    </form>
  </div>
  <div class="card-body">
    <div class="table-responsive table-card manifest-table" id="perf-log-list-container">
      <table *ngIf="listData.length > 0; else nodata" class="table" id="perf-log-list-table">
        <thead class="manifest-table-header">
          <tr>
            <th *ngFor="let column of columns" class="text-left" [ngClass]="{
            'w-1': column.value === 'action',
            'table-header': column.sortable
          }" (click)="changeSort(column)">
              <span class="mr-1" [innerHTML]="column.text"></span>
              <i [ngClass]="
              searchModel.sortBy === column.value
                ? 'fa fa-sort-' + currentSort
                : ''
            "></i>
            </th>

          </tr>
        </thead>
        <tbody *ngFor="let item of listData; let i = index">
          <tr>
            <td class="text-left">
              <div class="pre-formatted-text">{{ item?.logDate ?? '' | utcToBrowserTime : 'split' }}</div>
            </td>
            <td class="text-left">
              {{ item.machineName }} <br />
              {{ item.userIdentity }}
            </td>
            <td class="text-left">
              {{ item.appName }}
            </td>
            <td class="text-left">
              {{ item.activityId }}
            </td>
            <td class="text-left">
              {{ item.appModule }}
            </td>
            <td class="text-left">
              {{ item.appFunction }}
            </td>
            <td class="text-left">
              <!-- {{ item.elapsedTimeMs }} MS -->
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <app-pagination #pagination [totalItems]="totalItems" [currentPage]="searchModel.page"
    (pageOptionChanged)="paginationChange($event)"></app-pagination>
</div>
<ng-template #nodata>
  <app-no-data-found></app-no-data-found>
</ng-template>
