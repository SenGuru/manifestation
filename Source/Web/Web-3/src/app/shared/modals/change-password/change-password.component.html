<form #changePasswordForm="ngForm" (ngSubmit)=" changePasswordForm.form.valid && onClickSubmit(changePasswordForm)">
    <div class="modal-header p-3">
        <h5 class="modal-title" id="auditduo-change-password-modal-title">{{title}}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cancel"
            id="auditduo-change-password-modal-cancel-btn" (click)="cancel(true)"></button>
    </div>
    <div class="modal-body">
        <div class="row mb-4">
            <div class="col-lg-10">
                <div>
                    <label for="currentPassword" class="form-label">Old Password
                        <span class="required-sign">&nbsp;*</span>
                        <span class="pull-right cursor-pointer mr-1">
                            <a href="/forgot-password" target="_blank"
                                class="link-primary text-decoration-underline">Forgot
                                Password ?</a> </span>
                    </label>
                    <input #userOldPassword="ngModel" type="password" id="currentPassword"
                        placeholder="Enter current password" name="currentPassword" class="form-control"
                        autocomplete="off" required [ngClass]="{
                                        'form-control': true,
                                        'is-invalid': changePasswordForm.submitted && userOldPassword.invalid
                                      }" [(ngModel)]="changePasswordModel.currentPassword">
                    <div class="invalid-feedback invalid-feedback-fixed">
                        <span *ngIf="(changePasswordForm.submitted) && userOldPassword.errors?.['required']">
                            Old Password is required
                        </span>
                    </div>
                </div>
            </div><!--end col-->
        </div>
        <div class="row mb-4">
            <div class="col-lg-10">
                <div>
                    <label for="newpasswordInput" class="form-label">New Password
                        <span class="required-sign">&nbsp;*</span>
                    </label>
                    <input #userNewPassword="ngModel" type="password" class="form-control" id="newpasswordInput"
                        placeholder="Enter new password" name="newpasswordInput" autocomplete="off" required [ngClass]="{
                                        'form-control': true,
                                        'is-invalid': changePasswordForm.submitted && userNewPassword.invalid
                                      }" [(ngModel)]="changePasswordModel.password">
                    <div class="invalid-feedback invalid-feedback-fixed">
                        <span *ngIf="(changePasswordForm.submitted) && userNewPassword.errors?.['required']">
                            New Password is required
                        </span>
                    </div>
                </div>
            </div><!--end col-->
        </div>
        <div class="row mb-4">
            <div class="col-lg-10">
                <div>
                    <label for="confirmpasswordInput" class="form-label">Confirm
                        Password
                        <span class="required-sign">&nbsp;*</span>
                    </label>
                    <input #confirmNewPassword="ngModel" type="password" class="form-control" id="confirmpasswordInput"
                        placeholder="Confirm password" name="confirmpasswordInput" autocomplete="off" required
                        [ngClass]="{
                                        'form-control': true,
                                        'is-invalid': changePasswordForm.submitted && confirmNewPassword.invalid
                                      }" [(ngModel)]="changePasswordModel.retypedPassword">
                    <div class="invalid-feedback invalid-feedback-fixed">
                        <span *ngIf="(changePasswordForm.submitted) && confirmNewPassword.errors?.['required']">
                            Confirm Password is required
                        </span>
                    </div>
                </div>
            </div><!--end col-->
        </div><!--end row-->

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-light btn-sm aduo-btn-sm" id="auditduo-change-password-modal-close-btn"
            data-bs-dismiss="modal" (click)="cancel(true)">Close</button>
        <button type="submit" class="btn btn-sm aduo-btn-sm btn-success"
            id="auditduo-change-password-modal-change-btn">{{buttonText}}</button>
    </div>
</form>
