<div class="modal-header p-3">
    <h5 class="modal-title" id="auditduo-confirm-dialoge-title">{{title}}</h5>
    <button type="button" id="auditduo-confirm-dialoge-close-btn" class="btn-close" (click)="dismiss()"></button>
</div>
<div class="modal-body">
    <div>{{message}}</div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-light btn-sm" id="auditduo-confirm-modal-close-btn" data-bs-dismiss="modal"
    (click)="dismiss();">Close</button>
    <button type="submit" class="btn btn-success btn-sm" id="auditduo-confirm-modal-add-btn" (click)="close();">Yes</button>
</div>
