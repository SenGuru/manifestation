<div ngbDropdown class="dropdown topbar-head-dropdown ms-1 header-item" [autoClose]="true">
                    <button type="button" ngbDropdownToggle
                        class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle"
                        id="page-header-notifications-dropdown" data-bs-toggle="dropdown" aria-haspopup="true"
                        aria-expanded="false">
                        <i class='bx bx-bell fs-22'></i>
                        <span
                            class="position-absolute topbar-badge fs-10 translate-middle badge rounded-pill bg-danger">3<span
                                class="visually-hidden">unread messages</span></span>
                    </button>
                    <div ngbDropdownMenu class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0"
                        aria-labelledby="page-header-notifications-dropdown">

                        <div class="dropdown-head bg-secondary bg-pattern rounded-top">
                            <div class="p-3">
                                <div class="row align-items-center">
                                    <div class="col">
                                        <h6 class="m-0 fs-16 fw-semibold text-white"> Notifications </h6>
                                    </div>
                                    <div class="col-auto dropdown-tabs">
                                        <span class="badge bg-light text-body fs-13"> {{allnotifications.length}}
                                            New</span>
                                    </div>
                                </div>
                            </div>

                            <div class="px-2 pt-2">
                                <ul #nav="ngbNav" ngbNav class="nav nav-tabs dropdown-tabs nav-tabs-custom"
                                    id="notificationItemsTab" [activeId]="1">
                                    <li [ngbNavItem]="1">
                                        <a ngbNavLink>
                                            All ({{allnotifications.length}})
                                        </a>
                                        <ng-template ngbNavContent>
                                            <div class="tab-pane fade show active py-2 ps-2" id="all-noti-tab"
                                                role="tabpanel">
                                                <ngx-simplebar style="max-height: 300px;">
                                                    <div class="pe-2">
                                                        <div
                                                            *ngFor="let item of allnotifications" class="text-reset notification-item d-block dropdown-item position-relative">
                                                            <div class=" d-flex">
                                                              
                                                                <div class="avatar-xs me-3">
                                                                    <span
                                                                        class="avatar-title bg-info-subtle text-info rounded-circle fs-16">
                                                                        <i class="ri-message-3-line"></i>
                                                                    </span>
                                                                </div>
                                                                <div class="flex-grow-1">
                                                                    <a href="javascript:void(0);"
                                                                        class="stretched-link">
                                                                        <h6 class="mt-0 mb-2 lh-base">
                                                                            <!-- {{item.desc}} -->
                                                                        </h6>
                                                                    </a>
                                                                    <p
                                                                        class="mb-0 fs-11 fw-medium text-uppercase text-muted">
                                                                        <span><i
                                                                                class="mdi mdi-clock-outline"></i>
                                                                                <!-- {{item.time}} -->
                                                                            </span>
                                                                    </p>
                                                                </div>


                                                                <div class="px-2 fs-15">
                                                                    <!-- <input class="form-check-input" type="checkbox"
                                                                        value="{{item.id}}"
                                                                        [(ngModel)]="item.state"> -->
                                                                </div>
                                                            </div>
                                                        </div>
                                                        
                                                        <div *ngIf="!allnotifications || allnotifications.length === 0" class="tab-pane p-4" id="alerts-tab" role="tabpanel"
                                                            aria-labelledby="alerts-tab">
                                                            <div class="w-25 w-sm-50 pt-3 mx-auto">
                                                                <img src="assets/images/bell.svg" class="img-fluid"
                                                                    alt="user-pic">
                                                            </div>
                                                            <div class="text-center pb-5 mt-2">
                                                                <h6 class="fs-18 fw-semibold lh-base">Hey! You have no
                                                                    any
                                                                    notifications </h6>
                                                            </div>
                                                        </div> 
                                                        <div *ngIf="allnotifications && allnotifications.length > 0"  class="my-3 text-center">
                                                            <button type="button"
                                                                class="btn btn-soft-success waves-effect waves-light">View
                                                                All Notifications <i
                                                                    class="ri-arrow-right-line align-middle"></i></button>
                                                        </div>
                                                    </div>


                                                </ngx-simplebar>
                                            </div>
                                        </ng-template>
                                    </li>
                                    <li [ngbNavItem]="2">
                                        <a ngbNavLink>
                                            Messages
                                        </a>
                                        <ng-template ngbNavContent>
                                            <div class="tab-pane fade show active py-2 ps-2" id="all-noti-tab"
                                                role="tabpanel">
                                                <ngx-simplebar style="max-height: 300px;">
                                                    <div class="pe-2">
                                                     
                                                        <div *ngFor="let message of messages" class="text-reset notification-item d-block dropdown-item">
                                                            <!-- <div class="d-flex">
                                                                <img class="me-3 rounded-circle avatar-xs"
                                                                    alt="user-pic"
                                                                    src="{{message.avatar}}">
                                                                <div class="flex-grow-1">
                                                                    <a href="javascript:void(0);"
                                                                        class="stretched-link">
                                                                        <h6 class="mt-0 mb-1 fs-13 fw-semibold">
                                                                            {{message.name}}</h6>
                                                                    </a>
                                                                    <div class="fs-13 text-muted">
                                                                        <p class="mb-1">{{message.message}}</p>
                                                                    </div>
                                                                    <p
                                                                        class="mb-0 fs-11 fw-medium text-uppercase text-muted">
                                                                        <span><i class="mdi mdi-clock-outline"></i>
                                                                            {{message.time_ago}}</span>
                                                                    </p>
                                                                </div>
                                                                <div class="px-2 fs-15">
                                                                    <input class="form-check-input" type="checkbox"
                                                                        value="{{message.id}}"
                                                                        id="{{message.checkboxId}}"
                                                                        [(ngModel)]="message.state">
                                                                    <label class="form-check-label"
                                                                        for="{{message.checkboxId}}"></label>
                                                                </div>
                                                            </div> -->
                                                        </div>
                                                        <div *ngIf="!messages || messages.length === 0" class="tab-pane p-4" id="alerts-tab"
                                                            role="tabpanel" aria-labelledby="alerts-tab">
                                                            <div class="w-25 w-sm-50 pt-3 mx-auto">
                                                                <img src="assets/images/bell.svg" class="img-fluid"
                                                                    alt="user-pic">
                                                            </div>
                                                            <div class="text-center pb-5 mt-2">
                                                                <h6 class="fs-18 fw-semibold lh-base">Hey! You have no
                                                                    any
                                                                    notifications </h6>
                                                            </div>
                                                        </div>

                                                        <div *ngIf="messages && messages.length > 0" class="my-3 text-center">
                                                            <button type="button"
                                                                class="btn btn-soft-success waves-effect waves-light">View
                                                                All Messages <i
                                                                    class="ri-arrow-right-line align-middle"></i></button>
                                                        </div> 
                                                    </div>


                                                </ngx-simplebar>
                                            </div>
                                        </ng-template>
                                    </li>
                                    <li [ngbNavItem]="3">
                                        <a ngbNavLink>
                                            Alerts
                                        </a>
                                        <ng-template ngbNavContent>
                                            <div class="tab-pane p-4" id="alerts-tab" role="tabpanel"
                                                aria-labelledby="alerts-tab">
                                                <div class="w-25 w-sm-50 pt-3 mx-auto">
                                                    <img src="assets/images/bell.svg" class="img-fluid"
                                                        alt="user-pic">
                                                </div>
                                                <div class="text-center pb-5 mt-2">
                                                    <h6 class="fs-18 fw-semibold lh-base">Hey! You have no any
                                                        notifications </h6>
                                                </div>
                                            </div>
                                        </ng-template>
                                    </li>

                                </ul>
                            </div>

                        </div>

                        <div class="tab-content" id="notificationItemsTabContent">
                            <div class="tab-content text-muted">
                                <div [ngbNavOutlet]="nav"></div>
                            </div>
                        </div>
 
                    </div>
                </div>
