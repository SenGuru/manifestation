                                        <p class="text-muted">Sign in to continue to the filmiCall admin panel.</p>
                                    </div>
                                    <div class="p-2 mt-3 admin-panel-login-form">
                                        <form #adminlogin="ngForm"
                                            (ngSubmit)="adminlogin.form.valid && onSubmitAdminLogin(adminlogin)">
                                            <div class="mb-3">
                                                <label class="form-label" for="">User Name</label>
                                                <input #lvUsername="ngModel" type="text" name="username"
                                                    class="form-control" required placeholder="User Name"
                                                    autocomplete="randomName" [ngClass]="{
                                                'form-control': true,
                                                'is-invalid': adminlogin.submitted && lvUsername.invalid
                                              }" [(ngModel)]="credentials.username" />
                                                <div *ngIf="
                                                adminlogin.submitted && lvUsername.invalid"
                                                    class="invalid-feedback invalid-feedback-fixed mt-0">
                                                    User Name is required
                                                </div>
                                            </div>
                                            <div *ngIf="siteDetails?.loginOptionModel && siteDetails.loginOptionModel.useBuiltInAuthentication"
                                                class="mb-3">
                                                <div class="float-end">
                                                    <a routerLink="/forgot-password" class="text-muted me-2">Forgot
                                                        password?</a>
                                                </div>
                                                <label class="form-label" for=""> Password </label>
                                                <input #lvPassword="ngModel" type="password"
                                                    name="password" autocomplete="new-password" class="form-control"
                                                    required placeholder="Password" [ngClass]="{
                                                'form-control': true,
                                                'is-invalid': adminlogin.submitted && lvPassword.invalid
                                              }" [(ngModel)]="credentials.password" />
                                                <div *ngIf="adminlogin.submitted && lvPassword.invalid"
                                                    class="invalid-feedback invalid-feedback-fixed mt-0">
                                                    <div *ngIf="lvPassword.errors?.['required']">Password is required</div>
                                                </div>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value=""
                                                    id="auth-remember-check">
                                                <label class="form-check-label" for="auth-remember-check">Remember
                                                    me</label>
                                            </div>

                                            <div class="mt-4">
                                                <button class="btn btn-success w-100" type="submit">Sign In</button>
                                            </div>

                                            <div class="mt-4 text-center">
                                                <p class="mb-0">If you're user <a routerLink="/user/login"
                                                        class="fw-semibold text-primary text-decoration-underline">
                                                        click here
                                                    </a> to proceed. </p>
                                            </div>
                                            <div class="mt-4 text-center">
                                                <div class="signin-other-title">
                                                    <h5 class="fs-13 mb-4 title">Sign In with</h5>
                                                </div>
                                                <div class="d-flex gap-2 justify-content-center">
                                                    <!-- <button type="button" class="btn btn-primary btn-icon waves-effect waves-light"><i class="ri-facebook-fill fs-16"></i></button> -->
                                                    <button type="button" title="Google Sign-In"
                                                        class="btn btn-danger btn-icon waves-effect waves-light"
                                                        (click)="loginServerWithGlAndMs(predefinedSingleSignOnServerType.Google)">
                                                        <i class="ri-google-fill fs-20"></i>
                                                    </button>

                                                    <button type="button" title="Microsoft Sign-In"
                                                        class="btn btn-info btn-icon waves-effect waves-light"
                                                        (click)="loginServerWithGlAndMs(predefinedSingleSignOnServerType.Microsoft)"><i
                                                            class="mdi mdi-microsoft-office fs-20"></i></button>
                                                    <!-- <button type="button" class="btn btn-dark btn-icon waves-effect waves-light"><i class="ri-github-fill fs-16"></i></button>
                                                  <button type="button" class="btn btn-info btn-icon waves-effect waves-light"><i class="ri-twitter-fill fs-16"></i></button> -->
                                                </div>
                                            </div>
                                            <div class="site-config app-version-container">
                                                <div class="filmicall-login-form-app-version-info">App Version :
                                                    {{siteDetails?.appVersion}} </div>
                                            </div>
                                        </form>
