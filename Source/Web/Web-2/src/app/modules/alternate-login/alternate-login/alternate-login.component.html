<div class="border-top-wide border-primary d-flex flex-column">
  <div class="flex-fill d-flex flex-column justify-content-center">

    <div class="container-tight py-3 mt-5">
      <div class="text-center mb-4">
        <img src="../../../../assets/tabler/static/logo-signIn-1.svg" height="36" alt="">
      </div>
      <form #userlogin="ngForm" class="card card-md" (ngSubmit)="userlogin.form.valid && onClickSubmit(userlogin)">
        <div class="card-body">
          <h2 class="mb-5 text-center">Login with Super Admin</h2>
          <div class="mb-3">
            <label class="form-label" for="loginInAsUsername">User Name</label>
            <input #loginInAsUsername type="email" name="loginInAsUsername" id="loginInAsUsername" class="form-control"
              required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$"
              placeholder="Enter User Name" autocomplete="off"
              [ngClass]="{'is-invalid': userlogin.submitted && userlogin.form.get('loginInAsUsername')?.invalid }" [(ngModel)]="credentials.loginInAsUsername">
            <div *ngIf="userlogin.submitted && userlogin.form.get('loginInAsUsername')?.invalid"
              class="invalid-feedback">
              <div *ngIf="userlogin.form.get('loginInAsUsername')?.errors?.['required']">User Name is required</div>
              <div *ngIf="userlogin.form.get('loginInAsUsername')?.errors?.['pattern']">Email is not valid</div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="username">Super Admin User Name</label>
            <input #username type="email" name="username" id="username" required
              pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" class="form-control"
              placeholder="Enter Super Admin User Name" autocomplete="off"
              [ngClass]="{'is-invalid': userlogin.submitted && userlogin.form.get('username')?.invalid }" [(ngModel)]="credentials.username">
            <div *ngIf="userlogin.submitted && userlogin.form.get('username')?.invalid" class="invalid-feedback">
              <div *ngIf="userlogin.form.get('username')?.errors?.['required']">Super Admin User Name is required</div>
              <div *ngIf="userlogin.form.get('username')?.errors?.['pattern']">Email is not valid</div>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label" for="password">
              Super Admin Password
            </label>
            <input #password="ngModel" type="password" name="password" id="password" required class="form-control"
              placeholder="Password" [ngClass]="{'is-invalid': userlogin.submitted && password.invalid }"
              [(ngModel)]="credentials.password">
            <div *ngIf="userlogin.submitted && password.invalid" class="invalid-feedback" >
              <div *ngIf="password?.errors?.['required']">Password is required</div>
            </div>

          </div>

          <div class="mb-2 hide-element" >
            <div class="form-label">Select Role</div>
            <select name="cmbRole" class="form-select" [(ngModel)]="selected">
              <option value="1">Super Admin</option>
              <option value="2">Court Admin</option>
              <option value="3">Court Manager</option>
              <option value="6">Court Reporter</option>
              <option value="5">Viewer</option>
            </select>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary btn-block">Sign in</button>
          </div>
        </div>
      </form>

    </div>
  </div>
</div>
