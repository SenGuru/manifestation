<div class="modal-header p-3">
    <h5 class="modal-title" id="auditduo-confirm-dialoge-title">{{title}}</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="dismiss()"></button>
</div>
<div class="modal-body">
    <div>{{message}}</div>
</div>
<div class="modal-footer p-2">
    <button type="button" class="btn btn-light" id="auditduo-confirm-modal-close-btn" data-bs-dismiss="modal"
    (click)="dismiss();">Close</button>
    <button type="submit" class="btn btn-primary" id="auditduo-confirm-modal-add-btn" (click)="close();">Yes</button>
</div>
