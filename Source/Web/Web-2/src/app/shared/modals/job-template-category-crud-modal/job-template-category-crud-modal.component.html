
<form #lvJobTemplateCategoryForm="ngForm" name="form" appFocusOnError (ngSubmit)="lvJobTemplateCategoryForm.form.valid && onSubmit(lvJobTemplateCategoryForm)">
  <div class="modal-header bg-light p-3">
    <h5 class="modal-title" id="auditduo-job-template-category-modal-title">{{title}}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cancel"
      id="auditduo-job-template-category-modal-cancel-btn" (click)="cancel(true)"></button>
  </div>
  <div class="modal-body">

    <div class="form-group row mb-4">        

          <div class="col-sm-6">
            <label class="form-label" for="name">Name
              <span *ngIf="!isViewMode" class="required-sign">&nbsp;*</span>
            </label>
            <div *ngIf="!isViewMode">
              <input #lvName="ngModel" type="text" id="name" name="name" required ngbAutoFocus class="form-control"
                 placeholder="Name" [ngClass]="{'is-invalid': lvJobTemplateCategoryForm.submitted && lvName.invalid }"
                [(ngModel)]="jobTemplateCategoryModel.name">
              <div class="invalid-feedback invalid-feedback-fixed">
                <span *ngIf="(lvJobTemplateCategoryForm.submitted) && lvName.errors?.['required']">
                  Name is required
                </span>
              </div>
            </div>
            <div *ngIf="isViewMode">
              {{jobTemplateCategoryModel.name ? jobTemplateCategoryModel.name : '-'}}
            </div>
          </div>
      <div class="col-sm-6">
        <label class="form-label" for="selectedCompany">Company
          <span *ngIf="!isViewMode" class="required-sign">&nbsp;*</span>
        </label>
        <div *ngIf="!isViewMode">
          <ng-select #vcCompanyId #lvCompany="ngModel" placeholder="Company" class="form-control"
            name="selectedCompany" id="selectedCompany"
            bindLabel="companyName" required
            [items]="companys" [clearable]="false" [ngClass]="{'is-invalid': lvJobTemplateCategoryForm.submitted && lvCompany.invalid }" [typeahead]="companyTypeahead$"  [loading]="companyTypeaheadLoading" [(ngModel)]="selectedCompany">
          </ng-select>
          <div *ngIf="lvJobTemplateCategoryForm.submitted && lvCompany.invalid" class="invalid-feedback invalid-feedback-fixed">
            <div *ngIf="lvCompany.errors?.['required']">Company is required</div>
          </div>
        </div>
        <div *ngIf="isViewMode">
          {{jobTemplateCategoryModel.companyName ? jobTemplateCategoryModel.companyName : '-'}}
        </div>
      </div>
  </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light btn-sm aduo-btn-sm" id="auditduo-job-template-category-modal-close-btn" data-bs-dismiss="modal"
     (click)="cancel(true)">Close</button>
    <button *ngIf="!isViewMode" type="submit" class="btn btn-sm aduo-btn-sm btn-success" id="auditduo-job-template-category-modal-submit-btn">{{buttonText}}</button>
  </div>
</form>
