<div class="modal-header p-3">
    <h5 class="modal-title" id="error-dialoge-title">{{title}}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="error-dialoge-cancel-btn" (click)="dismiss()"></button>
</div>
<div class="modal-body">
    <div>{{message}}</div>
</div>
<div class="modal-footer"> 
    <button type="button" class="btn aduo-btn-sm btn-sm btn-light" id="error-modal-close-btn" data-bs-dismiss="modal" (click)="dismiss()">Cancel</button>
    <button type="button" class="btn aduo-btn-sm btn-sm btn-danger" id="error-modal-delete-btn" (click)="close()"> {{type ? 'Yes, '+ type : 'Yes, delete'}} </button>
</div>
