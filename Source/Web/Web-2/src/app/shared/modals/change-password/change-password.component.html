<form #changePasswordForm="ngForm" (ngSubmit)=" changePasswordForm.form.valid && onClickSubmit(changePasswordForm)">
    <div class="modal-header p-3">
        <h5 class="modal-title" id="auditduo-error-dialoge-title">Change Password</h5>
        <!--  (click)="close()" -->
        <button type="button" id="auditduo-error-dialoge-close-btn" class="btn-close"></button>
    </div>
    <div class="modal-body">
        <div class="form-group row mb-4">
            <div class="col-sm-12">
                <label class="form-label" for="currentPassword">Current Password</label>
                <input #currentPassword="ngModel" type="password" id="currentPassword" required name="currentPassword"
                    class="form-control" ngbAutofocus placeholder="Current Password"
                    [ngClass]="{'is-invalid': changePasswordForm.submitted && currentPassword.invalid }"
                    [(ngModel)]="changePasswordModel.currentPassword">
                <div *ngIf="changePasswordForm.submitted&&currentPassword.invalid" class="invalid-feedback">
                    <div *ngIf="currentPassword.errors?.['required']">Current Password is required</div>
                </div>
            </div>
        </div>
        <div class="form-group row mb-4">
            <div class="col-sm-12">
                <label class="form-label" for="password">Password</label>
                <input #password="ngModel" type="password" id="password" required name="password" class="form-control"
                    placeholder="Password" [ngClass]="{'is-invalid':changePasswordForm.submitted && password.invalid }"
                    [(ngModel)]="changePasswordModel.password">
                <div *ngIf="changePasswordForm.submitted&&password.invalid" class="invalid-feedback">
                    <div *ngIf="password.errors?.['required']">Password is required</div>
                </div>
            </div>
        </div>
        <div class="form-group row mb-4">
            <div class="col-sm-12">
                <label class="form-label required" for="password">Retype Password</label>
                <input #retypedPassword="ngModel" type="password" id="password" required name="retypedPassword"
                    class="form-control" placeholder="Retype Password"
                    [ngClass]="{'is-invalid': changePasswordForm.submitted && retypedPassword.invalid }"
                    [(ngModel)]="changePasswordModel.retypedPassword">
                <div *ngIf="changePasswordForm.submitted && retypedPassword.invalid" class="invalid-feedback">
                    <div *ngIf="retypedPassword.errors?.['required']">Retype Password is required</div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn aduo-btn-sm btn-sm btn-light" id="auditduo-change-password-modal-close-btn"
            data-bs-dismiss="modal">Close</button>
        <!-- (click)="close()" -->
        <button type="submit" class="btn aduo-btn-sm btn-sm btn-primary"
            id="auditduo-change-password-modal-change-btn">Change</button>
    </div>
</form>
