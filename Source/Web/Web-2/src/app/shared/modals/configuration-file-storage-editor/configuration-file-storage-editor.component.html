<div class="modal-content">
  <form #configurationReportForm="ngForm" novalidate focusOnError (ngSubmit)="onSubmit(configurationReportForm)">
    <div class="modal-header bg-light p-3">
      <h5 class="modal-title" id="auditduo-file-storage-modal-title">{{title}}</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cancel"
        id="auditduo-file-storage-modal-cancel-btn" (click)="close(configurationReportForm)"></button>
    </div>

    <div class="modal-body">
      <div class="form-group row mb-3 template-group-control">
        <div class="col-sm-8">
          <label class="col-form-label" for="selectedConnectionStrings"> Storage Type<span class="required-sign">&nbsp;*</span> </label>
          <ng-select #vcConnectionStringField #lvConnectionStringField="ngModel" class="form-control" name="connectionString"
            required
            id="selectedConnectionStrings"
            bindLabel="type" [items]="connectionStrings" [multiple]="false" [ngClass]="{ 'is-invalid': lvConnectionStringField.invalid && (lvConnectionStringField.dirty || lvConnectionStringField.touched || configurationReportForm.submitted)}"
            [clearable]="true" [(ngModel)]="selectedConnectionStrings" (change)="changeConnectionString()"></ng-select>
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && lvConnectionStringField.errors?.['required']">
              Storage Type is required
            </span>
          </div>
        </div>
      </div>
      <div *ngIf="selectDisk" class="form-group row mb-3 template-group-control">
        <div class="col-sm-8">
          <label class="col-form-label" for="diskpath">Path<span class="required-sign">&nbsp;*</span> </label>
          <input #diskPathInput="ngModel" type="textbox" class="form-control" id="diskpath" name="diskPath" required
            [ngClass]="{ 'is-invalid': diskPathInput.invalid && (diskPathInput.dirty || diskPathInput.touched || configurationReportForm.submitted)}" [(ngModel)]="diskPath"
            (ngModelChange)="changePath('disk',$event)" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && diskPathInput.errors?.['required']">
              Path is required
            </span>
          </div>
        </div>
      </div>
      <div *ngIf="selectGoogleStorage" class="form-group row mb-3 template-group-control">
        <div class="col-sm-6">
          <label class="col-form-label" for="googlestoragebucket"> Bucket<span class="required-sign">&nbsp;*</span> </label>
          <input #googleStorageBucketInput="ngModel" type="textbox" class="form-control" id="googlestoragebucket"
            name="googlestoragebucket" required
            [ngClass]="{ 'is-invalid': googleStorageBucketInput.invalid && (googleStorageBucketInput.dirty || googleStorageBucketInput.touched || configurationReportForm.submitted)}" [(ngModel)]="googleStorageBucket"
            (ngModelChange)="changePath('googleStorage',$event)" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && googleStorageBucketInput.errors?.['required']">
              Bucket is required
            </span>
          </div>
        </div>
        <div class="col-sm-6">
          <label class="col-form-label" for="googlestoragecred"> Credentials<span class="required-sign">&nbsp;*</span> </label>
          <input #googleStorageCredInput="ngModel" type="textbox" class="form-control" id="googlestoragecred"
            name="googlestoragecred" required
            [ngClass]="{ 'is-invalid': googleStorageCredInput.invalid && (googleStorageCredInput.dirty || googleStorageCredInput.touched || configurationReportForm.submitted)}" [(ngModel)]="googleStorageCred"
            (ngModelChange)="changePath('googleStorage',$event)" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && googleStorageCredInput.errors?.['required']">
              Credentials is required
            </span>
          </div>
        </div>
      </div>
      <div *ngIf="selectAws" class="form-group row mb-3 template-group-control">
        <div class="col-sm-6">
          <label class="col-form-label" for="awskeyid"> Key ID<span class="required-sign">&nbsp;*</span> </label>
          <input #awsKeyIdInput="ngModel" type="number" class="form-control" id="awskeyid" name="awskeyid"
            min="1" required [ngClass]="{ 'is-invalid': awsKeyIdInput.invalid && (awsKeyIdInput.dirty || awsKeyIdInput.touched || configurationReportForm.submitted)}" [(ngModel)]="awsKeyId"
            (ngModelChange)="changePath('aws',$event)" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && awsKeyIdInput.errors?.['required']">
              Key ID is required
            </span>
            <span *ngIf="(configurationReportForm.submitted) && awsKeyIdInput.errors?.['min']">
              Key ID is not a valid
            </span>
          </div>
        </div>
        <div class="col-sm-6">
          <label class="col-form-label" for="awskey"> Key<span class="required-sign">&nbsp;*</span> </label>
          <input #awsKeyInput="ngModel" type="textbox" class="form-control" id="awskey" name="awskey"
            required [ngClass]="{ 'is-invalid': awsKeyInput.invalid && (awsKeyInput.dirty || awsKeyInput.touched || configurationReportForm.submitted)}" [(ngModel)]="awsKey"
            (ngModelChange)="changePath('aws',$event)" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && awsKeyInput.errors?.['required']">
              Key is required
            </span>
          </div>
        </div>
        <!-- <div class="col-sm-6">
                <label class="col-form-label"> Bucket <span class="required-sign">&nbsp;*</span> </label>
                <input type="textbox" class="form-control" id="awsbucket"
                name="awsbucket" [(ngModel)]="awsBucket" (ngModelChange)="changePath('aws',$event)"
                #awsBucketInput="ngModel" required
                [ngClass]="{ 'is-invalid': awsBucketInput.invalid && (awsBucketInput.dirty || awsBucketInput.touched || configurationReportForm.submitted)}"/>
                <div  class="invalid-feedback invalid-feedback-fixed">
                      <span
                        *ngIf="configurationReportForm.submitted && awsBucketInput.errors?.['required']">
                        Bucket is required
                      </span>
                </div>
              </div> -->
        <!-- <div class="col-sm-6">
                <label class="col-form-label"> Region </label>
                <ng-select  [items]="awsRegions" [multiple]="false" name="awsregion" id="awsregion"
                [(ngModel)]="selectedawsRegions" [clearable]="true" (ngModelChange)="changePath('aws',$event)"
                #awsRegionInput="ngModel" required
                [ngClass]="{ 'is-invalid': awsRegionInput.invalid && (awsRegionInput.dirty || awsRegionInput.touched || configurationReportForm.submitted)}"></ng-select>
                <div class="invalid-feedback invalid-feedback-fixed">
                      <span
                        *ngIf="configurationReportForm.submitted && awsRegionInput.errors?.['required']">
                        Bucket is required
                      </span>
                </div>
              </div> -->
      </div>
      <div *ngIf="selectAws" class="form-group row mb-3 template-group-control">

        <div class="col-sm-6">
          <label class="col-form-label" for="awsbucket"> Bucket<span class="required-sign">&nbsp;*</span> </label>
          <input #awsBucketInput="ngModel" type="textbox" class="form-control" id="awsbucket" name="awsbucket"
            required [ngClass]="{ 'is-invalid': awsBucketInput.invalid && (awsBucketInput.dirty || awsBucketInput.touched || configurationReportForm.submitted)}" [(ngModel)]="awsBucket"
            (ngModelChange)="changePath('aws',$event)" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && awsBucketInput.errors?.['required']">
              Bucket is required
            </span>
          </div>
        </div>
        <div class="col-sm-6">
          <label class="col-form-label" for="awsregion"> Region <span class="required-sign">&nbsp;*</span> </label>
          <ng-select #awsRegionInput="ngModel" name="awsregion" id="awsregion" required
            [items]="awsRegions" [multiple]="false" [clearable]="true"
            [ngClass]="{ 'is-invalid': awsRegionInput.invalid && (awsRegionInput.dirty || awsRegionInput.touched || configurationReportForm.submitted)}" [(ngModel)]="selectedawsRegions"
            (ngModelChange)="changePath('aws',$event)"></ng-select>
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && awsRegionInput.errors?.['required']">
              Region is required
            </span>
          </div>
        </div>
      </div>
      <div *ngIf="selectAzureFiles" class="form-group row mb-3 template-group-control">
        <div class="col-sm-6">
          <label class="col-form-label" for="azurefilesaccount"> Account <span class="required-sign">&nbsp;*</span> </label>
          <input #azureFilesAccountInput="ngModel" type="textbox" class="form-control" id="azurefilesaccount"
            name="azurefilesaccount" required
            [ngClass]="{ 'is-invalid': azureFilesAccountInput.invalid && (azureFilesAccountInput.dirty || azureFilesAccountInput.touched || configurationReportForm.submitted)}" [(ngModel)]="azureFilesAccount"
            (ngModelChange)="changePath('azurefiles',$event)" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && azureFilesAccountInput.errors?.['required']">
              Acount is required
            </span>
          </div>
        </div>
        <div class="col-sm-6">
          <label class="col-form-label" for="azureFilesKey"> Key<span class="required-sign">&nbsp;*</span> </label>
          <input #azureFilesKeyInput="ngModel" type="textbox" class="form-control" id="azureFilesKey" name="azureFilesKey"
            required [ngClass]="{ 'is-invalid': azureFilesKeyInput.invalid && (azureFilesKeyInput.dirty || azureFilesKeyInput.touched || configurationReportForm.submitted)}" [(ngModel)]="azureFilesKey"
            (ngModelChange)="changePath('azurefiles',$event)" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && azureFilesKeyInput.errors?.['required']">
              Key is required
            </span>
          </div>
        </div>
      </div>
      <div *ngIf="selectAzureBlobStorage" class="form-group row mb-3 template-group-control">
        <div class="col-sm-6">
          <label class="col-form-label" for="azureblobstoragaccount"> Account <span class="required-sign">&nbsp;*</span> </label>
          <input #azureBlobStorageAccountInput="ngModel" type="textbox" class="form-control" id="azureblobstoragaccount"
            name="azureblobstoragaccount" required
            [ngClass]="{ 'is-invalid': azureBlobStorageAccountInput.invalid && (azureBlobStorageAccountInput.dirty || azureBlobStorageAccountInput.touched || configurationReportForm.submitted)}" [(ngModel)]="azureBlobStorageAccount"
            (ngModelChange)="changePath('azureblobstorage',$event)" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && azureBlobStorageAccountInput.errors?.['required']">
              Account is required
            </span>
          </div>
        </div>
        <div class="col-sm-6">
          <label class="col-form-label" for="azureblobstoragkey"> Key<span class="required-sign">&nbsp;*</span> </label>
          <input #azureBlobStorageKeyInput="ngModel" type="textbox" class="form-control" id="azureblobstoragkey"
            name="azureblobstoragkey" required
            [ngClass]="{ 'is-invalid': azureBlobStorageKeyInput.invalid && (azureBlobStorageKeyInput.dirty || azureBlobStorageKeyInput.touched || configurationReportForm.submitted)}" [(ngModel)]="azureBlobStorageKey"
            (ngModelChange)="changePath('azureblobstorage',$event)" />
          <div class="invalid-feedback invalid-feedback-fixed">
            <span *ngIf="configurationReportForm.submitted && azureBlobStorageKeyInput.errors?.['required']">
              Key is required
            </span>
          </div>
        </div>
      </div>
      <div class="form-group row mb-3 template-group-control">
        <div class="col-sm-12">
          <label class="col-form-label" for="requiredPath"> Connection String </label>
          <input type="textbox" class="form-control" id="requiredPath" name="requiredPath" disabled
            [(ngModel)]="requiredPath" />
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-light btn-sm aduo-btn-sm" id="auditduo-file-storage-modal-close-btn"
        data-bs-dismiss="modal" (click)="close(configurationReportForm)">Close</button>
      <button type="submit" class="btn btn-sm aduo-btn-sm btn-success"
        id="auditduo-file-storage-modal-submit-btn">Save</button>
    </div>

  </form>
</div>
