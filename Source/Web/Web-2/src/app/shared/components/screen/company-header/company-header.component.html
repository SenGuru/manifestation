<div class="row">
    <div class="col-lg-12">
        <div class="card mt-n4 mx-n4">
            <div class="aduo-bg-warning-subtle header-summary-bg">
                <div class="card-body pb-0 px-4">
                    <div class="row mb-3">
                        <div class="col-md">
                            <div class="row align-items-center g-3">
                                <div class="col-md-auto">
                                    <div class="col-auto">
                                        <div class="avatar-sm">
                                            <img alt="" class="img-thumbnail aduo-header-avatar-sm rounded-circle auditduo-header-img"
                                                [src]="companyProfilePicture" />
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md">
                                    <div>
                                        <h1 class="fw-bold">{{companyInfo ? companyInfo?.companyName : 'Company Information'}}
                                        </h1>
                                        <div class="hstack gap-3 flex-wrap">
                                            <div> <i class="mdi mdi-order-edit"></i> Companies : 20</div>
                                            <div class="vr"></div>
                                            <div><i class="mdi mdi-order-open"></i>  Not Audit : 8</div>
                                            <div class="vr"></div>
                                            <div><i class="mdi mdi-order-roll"></i> Completed : 12</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- <div class="col-md-auto">
                            <div class="hstack gap-1 flex-wrap">
                                <button type="button" class="btn py-0 fs-16 text-body material-shadow-none"
                                    (click)="backToCompanyListScreen();" *ngIf="isSuperAdmin">
                                    <i class="ri-arrow-go-back-fill"></i>
                                </button>
                            </div>
                        </div> -->
                    </div>

                </div>
                <!-- end card body -->
            </div>
        </div>
        <!-- end card -->
    </div>
    <!-- end col -->
</div>
