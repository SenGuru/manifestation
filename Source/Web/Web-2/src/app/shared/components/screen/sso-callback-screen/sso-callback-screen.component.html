<div class="row justify-content-center">
  <div class="col-sm-6 my-4 p-2">
     <div class="card p-2">
         <div *ngIf="provider"> Provider: {{provider}}</div>
         <div *ngIf="callBackUri"> CallBackUri: {{callBackUri}}</div>
         <div *ngIf="singleSignOnIdentifier"> Single Sign-On Identifier: {{singleSignOnIdentifier}}</div>
         <div *ngIf="code"> Code: {{code}}</div>
         <div *ngIf="access_token"> Access Token: {{access_token}}</div>
         <div *ngIf="error" class="text-danger"> Error: {{error}}</div>
         <div *ngIf="state"> State: {{state}}</div>
        </div>
  </div>
</div>
