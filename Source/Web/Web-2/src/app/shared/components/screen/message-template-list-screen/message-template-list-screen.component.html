<app-super-admin-summary-header></app-super-admin-summary-header>
<div class="px-4 py-2 aduo-list-screen-wrapper">
  <div class="page-header px-1 py-0 bg-white">
    <div class="d-flex align-items-center">
      <div class="col-sm-auto">
        <!-- Page title -->
        <h3 class="card-title mb-0 flex-grow-1">
          Message Templates
        </h3>
      </div>
      <!-- add messageTemplate btn -->
      <div class="d-flex justify-content-sm-end col-sm">
        <button type="button" class="btn btn-sm aduo-btn-sm btn-primary" data-bs-toggle="modal"
          id="create-message-template-btn" (click)="showAddMessageTemplateModal();"><i-tabler name="plus"
            class="tabler-icon-sm tabler-icon-stroke-white mx-1" /> Add Message Template</button>
      </div>
    </div>
  </div>
  <hr class="my-1 mb-3 aduo-selection-header-line" />
  <div class="card mb-2">
    <div class="card-header pt-2">
      <form #messageTemplateSearch="ngForm" novalidate focusOnError (ngSubmit)="onSearch(messageTemplateSearch)">

        <div class="row">
          <div class="col-md-2 pr-0">
            <input type="text" class="form-control" name="message-template-search-input" placeholder="Search Text"
              [(ngModel)]="this.searchModel.keyword" />
          </div>
          <div class="col-md-2">
            <ng-select placeholder="Company" name="selectedCompany" id="selectedCompany" bindLabel="companyName"
              [items]="companys" [clearable]="true" [typeahead]="companyTypeahead$" [loading]="companyTypeaheadLoading"
              [(ngModel)]="selectedCompany">
            </ng-select>
          </div>
          <div class="col-md-2 pr-0">
            <ng-select name="selectedPredefinedMessageTemplateTypes" bindLabel="type" placeholder="Message Event"
              [items]="predefinedMessageTemplateTypes" [multiple]="true" [clearable]="true"
              [(ngModel)]="selectedPredefinedMessageTemplateTypes">
              <ng-template let-item="item" let-index="index" let-search="searchTerm" ng-option-tmp>
                <div style="margin: 4px;" title="{{item.type}}">
                  <div> {{item.type}}</div>
                </div>
              </ng-template>
              <ng-template let-items="items" let-clear="clear" ng-multi-label-tmp>
                <div *ngFor="let item of selectedPredefinedMessageTemplateTypes | slice:-1:1" class="ng-value">
                  <span class="ng-value-label truncate cursor-pointer" title="{{item.type}}">{{item.type}}</span>
                  <span class="ng-value-icon right" aria-hidden="true" (click)="clear(item)">×</span>
                </div>
                <div *ngIf="items.length > 1" class="ng-value">
                  <span class="ng-value-label">{{items.length - 0}} Selected...</span>
                </div>
              </ng-template>
            </ng-select>
          </div>
          <div class="col-auto ml-auto mt-auto">
            <button type="submit" class="btn btn-primary btn-sm aduo-btn-sm mx-1" data-bs-toggle="modal"
              id="user-search-btn"><i-tabler name="search" class="tabler-icon-sm tabler-icon-stroke-white mx-1" />
              Search</button>
            <button type="button" class="btn btn-sm aduo-btn-sm bg-light" (click)="onReset(messageTemplateSearch)">
              Reset
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="card-body p-0">
      <div class="table-responsive aduo-table" id="message-template-list-container">
        <table *ngIf="listData.length > 0; else nodata"
          class="table card-table table-vcenter text-nowrap datatable table-striped" id="message-template-list-table">
          <thead>
            <tr>
              <th *ngFor="let column of columns" class="text-left" [ngClass]="{
          'w-1': column.value === 'action',
          'sort': column.sortable
        }" (click)="changeSort(column)">
                <span class="mr-1" [innerHTML]="column.text"></span>
                <i [ngClass]="
            searchModel.sortBy === column.value
              ? 'fa fa-sort-' + currentSort
              : ''
          "></i>
              </th>
              <th class="text-left w-1">
                <span class="mr-1">ACTION</span>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of listData">
              <td>
                <span
                  class="badge bg-{{enumViewService.getPredefinedMessageTemplateTypeClass(item.predefinedMessageTemplateTypeId)}}-subtle text-{{enumViewService.getPredefinedMessageTemplateTypeClass(item.predefinedMessageTemplateTypeId)}}">{{
                  item.predefinedMessageTemplateTypeName }}</span>
              </td>
              <td class="text-left">
                {{ item.companyName }}
              </td>
              <td class="text-left">
                {{ item.emailSubject }}
              </td>
              <td class="text-left">
                {{ item.modifiedDate | date: 'MM/dd/yy' }}
              </td>
              <td class="text-left">
                {{ item.modifiedByUserFirstName }} {{ item.modifiedByUserLastName }}
              </td>
              <td class="text-left">
                <div class="action-col-wrap">
                  <span class="mx-1">
                    <a class="cursor-pointer" (click)="showViewMessageTemplateModal(item)">
                      <span class="text-dark" title="View Message Template">
                        <i-tabler name="eye" class="tabler-icon-sm tabler-icon-stroke-gray" />
                      </span>
                    </a>
                  </span>
                  <span class="mx-1">
                    <a class="cursor-pointer" (click)="showUpdateMessageTemplateModal(item)">
                      <span class="text-dark" title="Edit Message Template">
                        <i-tabler name="edit" class="tabler-icon-sm tabler-icon-stroke-gray" />
                      </span>
                    </a>
                  </span>
                  <span class="mx-1">
                    <a class="cursor-pointer" (click)="deleteMessageTemplate(item)">
                      <span class="text-dark" title="Delete Message Template">
                        <i-tabler name="trash" class="tabler-icon-sm tabler-icon-stroke-gray" />
                      </span>
                    </a>
                  </span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <ng-template #nodata>
          <app-no-data-found></app-no-data-found>
        </ng-template>
      </div>
      <app-pagination #pagination [totalItems]="totalItems" [currentPage]="searchModel.page"
        (pageOptionChanged)="paginationChange($event)"></app-pagination>
    </div>
  </div>
</div>
