
<div class="page-header px-1 py-0 bg-white">
  <div class="d-flex align-items-center">
      <div class="col-sm-auto">
          <!-- Page title -->
          <h3 class="card-title mb-0 flex-grow-1">
              Job Template Parameters
          </h3>
      </div>
     <!-- add jobTemplateParameter btn -->
      <div *ngIf="!isViewMode" class="d-flex justify-content-sm-end col-sm"> 
          <button type="button" class="btn btn-success btn-sm aduo-btn-sm" 
           data-bs-toggle="modal" id="create-job-template-parameter-btn" (click)="showAddJobTemplateParameterModal();"><i-tabler name="plus" class="tabler-icon-sm tabler-icon-stroke-white mx-1" /> Add Job Template Parameter</button>
      </div>
  </div>
</div>
<div class="card mb-2">
<div class="card-body p-0">
<div class="table-responsive table-card auditduo-table" >
<table *ngIf="listData.length > 0; else nodata" class="table">
  <thead class="auditduo-table-header">
    <tr>
      <th
        *ngFor="let column of columns"
        class="text-left"
        [ngClass]="{
          'w-1': column.value === 'action',
          'sort': column.sortable
        }"
      >
        <span class="mr-1" [innerHTML]="column.text"></span>
        <i
          [ngClass]="
            searchModel.sortBy === column.value
              ? 'fa fa-sort-' + currentSort
              : ''
          "
        ></i>
      </th>
      <th
        class="text-left w-1"
      >
        <span class="mr-1">ACTION</span>
      </th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of listData;  let i = index">
      <td class="text-left">
        {{ item.name  }}
      </td>
      <td class="text-left">
        <span class="badge badge bg-{{enumViewService.getPredefinedFieldControlTypeClass(item.predefinedFieldControlTypeId)}}-subtle text-{{enumViewService.getPredefinedFieldControlTypeClass(item.predefinedFieldControlTypeId)}} ">
          {{item.predefinedFieldControlTypeName }}
         </span>
      </td>
      <td class="text-left">
        {{ item.position  }}
      </td> 
      <td class="text-left">
        {{ item.value  }}
      </td>  
      <td class="text-left">
        {{ item.caption  }}
      </td> 
      <td class="text-left">
        {{ item.size  }}
      </td> 
      <td class="text-left">
        <div *ngIf="!isViewMode" class="d-flex gap-2">
          <div class="edit">
              <button class="btn btn-sm aduo-btn-sm btn-success edit-item-btn" data-bs-toggle="modal" type="button" (click)="showUpdateJobTemplateParameterModal(item, i)">Edit</button>
          </div>
          <div class="remove">
              <button class="btn btn-sm aduo-btn-sm btn-danger remove-item-btn" data-bs-toggle="modal" type="button" (click)="deleteJobTemplateParameter(item, i)">Remove</button>
          </div>
       </div>

      </td>
    </tr>
  </tbody>
</table>
<ng-template #nodata>
<app-no-data-found></app-no-data-found>
</ng-template>
</div>
<app-pagination
#pagination
[totalItems]="totalItems" [currentPage]="searchModel.page"
(pageOptionChanged)="paginationChange($event)"
></app-pagination>
</div>
</div>
