<app-super-admin-summary-header></app-super-admin-summary-header>
<div class="px-4 py-2 aduo-list-screen-wrapper">
  <div class="page-header px-1 py-0 bg-white">
    <div class="d-flex align-items-center">
      <div class="col-sm-auto">
        <!-- Page title -->
        <h3 class="card-title mb-0 flex-grow-1">
          SMS Servers
        </h3>
      </div>
      <!-- add smsServer btn -->
      <div class="d-flex justify-content-sm-end col-sm">
        <button type="button" class="btn btn-primary btn-sm aduo-btn-sm" data-bs-toggle="modal" id="create-user-btn"
          (click)="showAddSmsServerModal();"><i-tabler name="plus" class="tabler-icon-sm tabler-icon-stroke-white mx-1" /> Add SMS Server</button>
      </div>
    </div>
  </div>
  <hr class="my-1 mb-3 aduo-selection-header-line" />
  <div class="card mb-2">
    <div class="card-header pt-2">
      <form #smsServerSearch="ngForm" novalidate focusOnError (ngSubmit)="onSearch(smsServerSearch)">

        <div class="row">
          <div class="col-md-2 pr-0">
            <input type="text" class="form-control" name="example-text-input" placeholder="Search Text"
              [(ngModel)]="this.searchModel.keyword" />
          </div>
          <div class="col-auto ml-auto mt-auto">
            <button type="submit" class="btn btn-primary btn-sm aduo-btn-sm mx-1" data-bs-toggle="modal"
              id="user-search-btn">
              <i-tabler name="search" class="tabler-icon-sm tabler-icon-stroke-white mx-1" />
              Search</button>
            <button type="button" class="btn btn-sm aduo-btn-sm bg-light" (click)="onReset(smsServerSearch)">
              Reset
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="card-body p-0" id="sms-server-list-container">
      <div class="table-responsive aduo-table">
        <table  *ngIf="listData.length > 0; else nodata" class="table card-table table-vcenter text-nowrap datatable table-striped" id="sms-server-list-table">
          <thead class="auditduo-table-header">
            <tr>
              <th *ngFor="let column of columns" class="text-left" [ngClass]="{
          'w-1': column.value === 'action',
          'sort': column.sortable
        }" (click)="changeSort(column)">
                <span class="mr-1" [innerHTML]="column.text"></span>
                <i [ngClass]="
            searchModel.sortBy === column.value
              ? 'fa fa-sort-' + currentSort
              : ''
          "></i>
              </th>
              <th class="text-left w-1">
                <span class="mr-1">ACTION</span>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of listData">
              <td class="text-left">
                {{ item.smsServerName }}
              </td>
              <td class="text-left">
                {{ item.host }}
              </td>
              <td class="text-left">
                {{ item.port }}
              </td>
              <td class="text-left">
                {{ item.senderName }}
              </td>
              <td class="text-left">
                {{ item.senderEmail }}
              </td>
              <td class="text-left">
                {{ item.userName }}
              </td>
              <td class="text-left">
                {{ item.modifiedDate | date: 'MM/dd/yy' }}
              </td>
              <td class="text-left">
                {{ item.modifiedBy }}
              </td>
              <td class="text-left">
                <div class="action-col-wrap">
                  <span class="mx-1">
                    <a class="cursor-pointer" (click)="showViewSmsServerModal(item)">
                      <span class="text-dark" title="View SMS Server">
                        <i-tabler name="eye" class="tabler-icon-sm tabler-icon-stroke-gray" />
                      </span>
                    </a>
                  </span>
                  <span class="mx-1">
                    <a class="cursor-pointer" (click)="showUpdateSmsServerModal(item)">
                      <span class="text-dark" title="Edit SMS Server">
                        <i-tabler name="edit" class="tabler-icon-sm tabler-icon-stroke-gray" />
                      </span>
                    </a>
                  </span>
                  <span class="mx-1">
                    <a class="cursor-pointer" (click)="deleteSmsServer(item)">
                      <span class="text-dark" title="Delete SMS Server">
                        <i-tabler name="trash" class="tabler-icon-sm tabler-icon-stroke-gray" />
                      </span>
                    </a>
                  </span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <ng-template #nodata>
          <app-no-data-found></app-no-data-found>
        </ng-template>
      </div>
      <app-pagination #pagination [totalItems]="totalItems" [currentPage]="searchModel.page"
        (pageOptionChanged)="paginationChange($event)"></app-pagination>
    </div>
  </div>
</div>
